name: Publish Release Firmware

# Builds every board's release firmware and attaches it to the release
# release-please has already cut, with the .bin named exactly as OtaUpdater
# requests it from the GitHub release: plain firmware.bin for the C3 X4/X3
# binary, firmware-<board>.bin for every other board.
#
# Dispatch-only, never tag-triggered: release-please cuts its tag with
# GITHUB_TOKEN, and a GITHUB_TOKEN-created tag does not trigger workflows.
# stein-infra's tofu-managed release-please fires this via
# `gh workflow run release-publish.yml` after the tag exists.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please created the release just before this workflow was
          # fired, so the latest release is the one to publish artifacts for.
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ -z "$TAG" ]; then
            echo "::error::No release found to publish artifacts for."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-release:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: gh_release
            asset: firmware.bin
          - pio_env: sticky-gh_release
            asset: firmware-sticky.bin
          - pio_env: x4pro-gh_release
            asset: firmware-x4pro.bin
          - pio_env: papermono-gh_release
            asset: firmware-papermono.bin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin

  publish-release:
    needs: [resolve-tag, build-release]
    runs-on: ubuntu-latest
    # Only this fork publishes; a downstream fork of it builds but stays silent.
    if: github.repository == 'victorstein/crosspoint-x4pro'
    permissions:
      # A job-level block replaces the workflow's top-level `contents: read`.
      contents: write
    steps:
      - name: Download board artifacts
        uses: actions/download-artifact@v4
        with:
          # One directory per artifact. merge-multiple would collide: every board
          # ships its own bootloader.bin and partitions.bin under the same name.
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          # All four boards are attached, not just one: the device picks the asset
          # name from its own board tag, so a missing board finds nothing to update
          # from. release-please already created the release, so this only uploads;
          # --clobber keeps a re-dispatch idempotent.
          gh release upload "$TAG" dist/*/firmware*.bin \
            --repo "$GITHUB_REPOSITORY" --clobber
